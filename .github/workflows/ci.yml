name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-gui:
    name: Test C# .NET 8 GUI
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Solution Dependencies
        run: dotnet restore FaceSeeker.sln

      - name: Build Solution
        run: dotnet build FaceSeeker.sln --no-restore --configuration Release

      - name: Run C# MSTest Suite
        run: dotnet test FaceSeeker.sln --no-build --configuration Release --verbosity normal

  test-engine:
    name: Test Python Vision Engine
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r FaceSeeker.Engine/requirements.txt

      - name: Run Engine Test Suite
        run: python tests/test_engine.py
