<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Seeker - Web Interface</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <div class="app-container">
    
    <!-- HEADER -->
    <header class="header animate-in delay-1">
      <div class="logo">
        <div class="logo-dot"></div>
        <span>Face Seeker</span>
      </div>
    </header>

    <main class="main-content">
      
      <!-- CONTROLS SIDEBAR -->
      <aside class="sidebar animate-in delay-2">
        <div class="control-card">
          <h3>Target Subject</h3>
          <p class="subtitle">Select the face to search for.</p>
          <div class="upload-zone" id="targetBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            <span id="targetLabel">Upload Photo</span>
          </div>
        </div>

        <div class="control-card">
          <h3>CCTV Footage</h3>
          <p class="subtitle">Select the video file to analyze.</p>
          <div class="upload-zone" id="videoBtn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
            <span id="videoLabel">Select Video</span>
          </div>
          <div id="videoStats" class="stats-text" style="display:none;"></div>
        </div>

        <div class="control-card">
          <h3>Settings</h3>
          <label class="setting-label">
            Cosine Similarity Threshold: <span id="threshVal">0.36</span>
            <input type="range" id="threshSlider" min="0.1" max="0.9" step="0.01" value="0.36">
          </label>
        </div>

        <div class="action-buttons">
          <button id="startBtn" class="btn btn-primary" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            Start Analysis
          </button>
          
          <div class="running-controls" id="runningControls" style="display: none;">
            <button id="pauseBtn" class="btn btn-secondary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
              Pause
            </button>
            <button id="stopBtn" class="btn btn-danger">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
              Stop
            </button>
          </div>
        </div>
      </aside>

      <!-- MAIN VIEWER -->
      <section class="viewer animate-in delay-3">
        <div class="video-container">
          <div class="video-placeholder" id="videoPlaceholder">
            <span>Video Feed Offline</span>
          </div>
          <img id="videoStream" src="" alt="Live Video Feed" style="display: none;">
        </div>
        
        <div class="progress-bar-container">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        
        <div class="stats-grid">
          <div class="stat-box">
            <span class="stat-label">Processed</span>
            <span class="stat-value" id="statProcessed">0 / 0 frames</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">FPS</span>
            <span class="stat-value" id="statFps">0.00</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">ETA</span>
            <span class="stat-value" id="statEta">0s</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">Matches</span>
            <span class="stat-value highlight" id="statMatches">0</span>
          </div>
        </div>
      </section>

      <!-- RESULTS SIDEBAR -->
      <aside class="results-sidebar animate-in delay-4">
        <h3>Matches</h3>
        <div class="matches-list" id="matchesList">
          <!-- Matches will populate here -->
          <div class="empty-state">No matches yet</div>
        </div>
      </aside>

    </main>

    <!-- FOOTER WITH ICONS (FROM SECUREPASS) -->
    <footer class="footer animate-in delay-5">
      <div class="socials">
        <a href="mailto:linkwithshivang@gmail.com" class="social-link" aria-label="Email" target="_blank" rel="noopener noreferrer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
        </a>
        <a href="https://www.linkedin.com/in/amshivang/" class="social-link" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
        </a>
        <a href="https://github.com/amshivang" class="social-link" aria-label="GitHub" target="_blank" rel="noopener noreferrer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
        </a>
        <a href="https://www.buymeacoffee.com/amshivang" class="social-link" aria-label="Buy Me a Coffee" target="_blank" rel="noopener noreferrer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
        </a>
      </div>
      <p class="footer-copy">Developed by Shivang &nbsp;·&nbsp; Advanced AI Tracking</p>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
